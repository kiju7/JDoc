plugins {
    id 'java-library'
}

group = 'com.jiran'
def versionMatch = file('../../CMakeLists.txt').text =~
        /project\(jdoc VERSION ([0-9]+\.[0-9]+\.[0-9]+)/
version = versionMatch.find() ? versionMatch.group(1) : 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    api 'net.java.dev.jna:jna:5.14.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Target Java 11 without pinning a toolchain: `--release 11` compiles against
// the Java 11 API using whatever JDK is installed (11, 17, 21, ...), so one
// configuration builds everywhere. A toolchain block would instead demand that
// exact JDK be present (or downloaded) and fails the build when it is not.
tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

test {
    useJUnitPlatform()

    // Locate libjdoc: default to the CMake build dir at the repo root, override
    // with -Djna.library.path=<dir> or the JDOC_LIB_DIR env var.
    def libDir = System.getProperty('jna.library.path') ?:
                 System.getenv('JDOC_LIB_DIR') ?:
                 "${rootDir}/../../build"
    systemProperty 'jna.library.path', libDir
    // macOS: the loader also needs the dylib's directory.
    environment 'DYLD_LIBRARY_PATH', libDir
    environment 'LD_LIBRARY_PATH', libDir
}
