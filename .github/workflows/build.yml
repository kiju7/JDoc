name: build

# Verifies the project configures, builds and passes tests on Linux, macOS and
# Windows. On the Windows runner there is no system zlib/libjpeg, so this also
# exercises the FetchContent (zlib) + ExternalProject (libjpeg-turbo) fallback
# and compiles the Windows-only I/O code paths under MSVC.
on:
  push:
    branches: [main]        # runs on merges to main, not on WIP develop pushes
  pull_request:
    branches: [main]        # and on pull requests targeting main
  workflow_dispatch:

# A newer push/PR update cancels an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # libjpeg-turbo's x86 SIMD (WITH_SIMD=ON) assembles with NASM; arm64 uses
      # NEON and ignores it. Harmless on the macOS runner.
      - name: Set up NASM
        uses: ilammy/setup-nasm@v1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJDOC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DJDOC_BUILD_TESTS=ON
          -DJDOC_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build -j 4

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DJDOC_BUILD_TESTS=ON
          -DJDOC_ENABLE_THREAD_SANITIZER=ON

      - name: Build concurrency test
        run: cmake --build build --target test_thread_safety -j 4

      - name: Run concurrency test under TSAN
        run: ctest --test-dir build -R '^test_thread_safety$' --output-on-failure

  bindings:
    name: Language bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Install Python build dependency
        run: python -m pip install pybind11

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_PYTHON=ON
          -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build
        run: cmake --build build -j 4

      - name: Test Python binding
        env:
          PYTHONPATH: build:python
        run: >-
          python -c "import jdoc;
          from concurrent.futures import ThreadPoolExecutor;
          assert jdoc.ConvertOptions().images is True;
          assert jdoc.convert_bytes(b'hello', 'x.txt') == 'hello';
          assert jdoc.convert_bytes(b'', 'empty.txt') == '';
          assert jdoc.detect_bytes(b'hello', 'x.txt').format == 'TXT';
          data = open('test/fixtures/pdf/sample.pdf', 'rb').read();
          eager = jdoc.convert_pages_bytes(data, 'sample.pdf');
          streamed = list(jdoc.convert_pages_bytes_stream(data, 'sample.pdf'));
          assert [(p.page_number, p.text) for p in eager] == [(p.page_number, p.text) for p in streamed];
          pool = ThreadPoolExecutor(max_workers=8);
          assert len(list(pool.map(lambda _: jdoc.convert_bytes(data, 'sample.pdf'), range(16)))) == 16;
          pool.shutdown()"

      - name: Test Python wheel ABI and package exports
        run: |
          python -m pip wheel . --no-deps -w wheelhouse
          python -m pip install --force-reinstall wheelhouse/*.whl
          cd /tmp
          python -c "import jdoc; assert hasattr(jdoc, 'convert_pages_bytes_stream')"

      - name: Test Go binding
        working-directory: bindings/go
        run: go test -race ./...

      - name: Test Java binding
        working-directory: bindings/java
        run: gradle test
